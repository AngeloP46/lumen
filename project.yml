name: Lumen
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        # CI passes CURRENT_PROJECT_VERSION=<run number>, so every build has its own version (SideStore needs this to see updates).
        CFBundleShortVersionString: "$(MARKETING_VERSION).$(CURRENT_PROJECT_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Lumen reads the RAW/ProRAW originals of photos you pick so it can edit them.
        NSPhotoLibraryAddUsageDescription: Lumen saves your exported photos to your library.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lumen
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Sources/Assets.xcassets, same design as sidestore/icon.png
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-cikernel"
  LumenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ui
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lumen.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lumen
schemes:
  Lumen:
    build:
      targets:
        Lumen: all
    test:
      targets:
        - LumenUITests
