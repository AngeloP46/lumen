name: UI tests
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this test method, for example testPinchZoomsAndDoubleTapToggles (empty = all)'
        required: false
        default: ''
      device:
        description: 'Simulator, e.g. "iPhone SE (3rd generation)" or "iPhone 16e" (small screens; empty = iPhone 16 Pro Max)'
        required: false
        default: ''
  # every work branch (the repo is public, so the macOS runners are free); main is only merged into after this passed
  push:
    branches-ignore: [main]
    paths:
      - 'Sources/**'
      - 'Tests/ui/**'
      - 'project.yml'
      - '.github/ci/**'
      - '.github/workflows/uitest.yml'

concurrency:
  group: uitest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uitest:
    runs-on: macos-15
    timeout-minutes: 75   # 45 ran out on 20 Oct (72+ tests, slow runners at night)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: bash .github/ci/install-xcodegen.sh
      - name: Sample photos
        run: |
          mkdir -p demo
          bash .github/ci/get.sh demo/1-a9.ARW "https://raw.pixls.us/data/Sony/ILCE-9/Sony_-_ILCE-9_-_compressed.ARW" 10000000
          bash .github/ci/get.sh demo/2-cat.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Cat_November_2010-1a.jpg?width=2000" 100000
          bash .github/ci/get.sh demo/3-matterhorn.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Matterhorn_from_Domh%C3%BCtte_-_2.jpg?width=2000" 100000
      - name: Run UI tests
        env:
          TEST_RUNNER_DEMO_DIR: ${{ github.workspace }}/demo
          TEST_RUNNER_OUT_DIR: ${{ github.workspace }}/uiout
          ONLY_TEST: ${{ github.event.inputs.only }}
          SIM_DEVICE: ${{ inputs.device }}
        # xcodebuild's own exit status is the job's status. The log goes to a file first and is filtered afterwards,
        # so a pipe closing early (head) can never turn a passing run into a failure or hide a failing one.
        run: |
          mkdir -p uiout
          # the AI models are only fetched for real builds; empty stand-ins keep the project building (no Depth/Landscape)
          mkdir -p Models/DepthAnythingV2SmallF16.mlmodelc Models/DETRResnet50SemanticSegmentationF16.mlmodelc Models/LaMa.mlmodelc Models/Denoise.mlmodelc
          xcodegen generate
          DEVICE="${SIM_DEVICE:-iPhone 16 Pro Max}"
          UDID=$(xcrun simctl list devices available | grep -F "$DEVICE (" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then echo "::error::No simulator named $DEVICE"; xcrun simctl list devices available; exit 1; fi
          echo "Simulator: $DEVICE"
          xcrun simctl boot $UDID
          xcrun simctl bootstatus $UDID -b
          set +e
          ONLY_ARG=""
          if [ -n "$ONLY_TEST" ]; then ONLY_ARG="-only-testing:LumenUITests/LumenUITests/$ONLY_TEST"; fi
          xcodebuild test -project Lumen.xcodeproj -scheme Lumen $ONLY_ARG \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            > uiout/xcodebuild.log 2>&1
          code=$?
          grep -E "Test Case|error:|XCTAssert|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" uiout/xcodebuild.log | head -300
          echo "xcodebuild exit code: $code"
          # failures as annotations too, so they can be read through the API without downloading logs
          grep -E "error:|Test Case .* failed" uiout/xcodebuild.log | sed -E 's#^/[^:]*/##' | sort -u \
            | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        if: always()
        with:
          name: uitest
          path: uiout
