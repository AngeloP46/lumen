name: UI screenshots
on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/ui-test.yml'
jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Sample photos
        run: |
          mkdir -p demo
          curl -sL -o demo/1-a9.ARW "https://raw.pixls.us/data/Sony/ILCE-9/Sony_-_ILCE-9_-_compressed.ARW"
          curl -sL -o demo/2-cat.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Cat_November_2010-1a.jpg?width=2000"
          curl -sL -o demo/3-matterhorn.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Matterhorn_from_Domh%C3%BCtte_-_2.jpg?width=2000"
          ls -la demo
      - name: Build for simulator
        run: |
          xcodegen generate
          xcodebuild -project Lumen.xcodeproj -scheme Lumen -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS=arm64 | tail -5
      - name: Boot simulator
        run: |
          xcrun simctl list devices available | grep -i "iPhone" | head -20
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro Max" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot $UDID
          xcrun simctl bootstatus $UDID -b
          xcrun simctl install $UDID build/Build/Products/Release-iphonesimulator/Lumen.app
          CONTAINER=$(xcrun simctl get_app_container $UDID com.example.lumen data)
          mkdir -p "$CONTAINER/Documents/demo"
          cp demo/* "$CONTAINER/Documents/demo/"
          echo "DEMO=$CONTAINER/Documents/demo" >> $GITHUB_ENV
      - name: Screenshots
        run: |
          mkdir -p shots
          shot() { # name, args...
            name=$1; shift
            WAIT=${WAIT:-14}
            xcrun simctl terminate $UDID com.example.lumen 2>/dev/null || true
            xcrun simctl launch $UDID com.example.lumen -lumenDemoDir "$DEMO" "$@"
            sleep $WAIT
            xcrun simctl io $UDID screenshot shots/$name.png
          }
          shot 00-library
          shot 01-light-landscape -lumenDemoOpen 0 -lumenDemoTool Light -lumenDemoEdit 1
          shot 02-light-portrait -lumenDemoOpen 1 -lumenDemoTool Light -lumenDemoEdit 1
          shot 03-light-strip -lumenDemoOpen 1 -lumenDemoTool Light -lumenDemoEdit 1 -lumenDemoSlider strip
          shot 04-color-landscape -lumenDemoOpen 0 -lumenDemoTool Color -lumenDemoEdit 1
          shot 05-hsl -lumenDemoOpen 2 -lumenDemoTool Color -lumenDemoMix 1
          shot 06-grade -lumenDemoOpen 1 -lumenDemoTool Grade -lumenDemoEdit 1
          shot 07-curve -lumenDemoOpen 2 -lumenDemoTool Curve
          shot 08-detail -lumenDemoOpen 0 -lumenDemoTool Detail
          shot 09-masks-linear -lumenDemoOpen 0 -lumenDemoTool Masks -lumenDemoMask linear
          shot 10-masks-luminance -lumenDemoOpen 2 -lumenDemoTool Masks -lumenDemoMask luminance
          shot 11-masks-adjust -lumenDemoOpen 0 -lumenDemoTool Masks -lumenDemoMask radial -lumenDemoMaskTab adjust
          shot 12-presets -lumenDemoOpen 0 -lumenDemoTool Presets
          shot 13-crop -lumenDemoOpen 1 -lumenDemoTool Crop
          WAIT=45 shot 14-masks-subject -lumenDemoOpen 1 -lumenDemoTool Masks -lumenDemoMask subject
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
