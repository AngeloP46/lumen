name: TestFlight upload (App Store build)
# Builds the App Store version (APP_STORE flag, com.lumenraw.app, iPhone only, "Lumen RAW") from the sandbox branch,
# signs it in Apple's cloud with an App Store Connect API key and uploads it to TestFlight. Manual only.
# Needs these repository secrets (Angelo adds them in GitHub → Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect → Users and Access → Integrations → App Store Connect API (Admin key)
#   ASC_KEY_P8                  the contents of the downloaded AuthKey_<id>.p8 file
#   APPLE_TEAM_ID               developer.apple.com → Account → Membership details → Team ID
on:
  workflow_dispatch:
  # GitHub only offers "Run workflow" for a workflow it has seen run; this push run is skipped at once
  push:
    branches: [sandbox]
    paths: ['.github/workflows/testflight.yml']

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/sandbox' && github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Secrets present
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is missing (see the top of testflight.yml)"; exit 1; }
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 pinned
        with:
          path: Models/.verified-packages
          key: models-verified-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/model-lock.json', '.github/ci/heal-convert/**', '.github/ci/denoise-convert/**') }}
      - name: AI models (verified depth, scene, heal, denoise)
        run: |
          bash .github/ci/get-depth-model.sh Models
          bash .github/ci/get-seg-model.sh Models
          bash .github/ci/get-heal-model.sh Models
          bash .github/ci/denoise-convert/build-denoise.sh Models
      - name: Install pinned XcodeGen
        run: bash .github/ci/install-xcodegen.sh
      - name: Generate Xcode project (App Store name and version)
        run: |
          xcodegen generate
          P=Config/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Lumen RAW' $P
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0' $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" $P
          # standard encryption only (HTTPS via Apple's frameworks): skips the export-compliance question per upload
          /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' $P
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive (signed in Apple's cloud)
        run: |
          set -o pipefail
          xcodebuild archive -project Lumen.xcodeproj -scheme Lumen -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Lumen.xcarchive" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=APP_STORE TARGETED_DEVICE_FAMILY=1 \
            PRODUCT_BUNDLE_IDENTIFIER=com.lumenraw.app CODE_SIGN_ENTITLEMENTS=Lumen.entitlements \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > archive.log 2>&1 \
            || { grep -E "error:" archive.log | head -30; tail -40 archive.log; exit 1; }
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lumen.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} (1.0). It appears in TestFlight after Apple's processing (10-30 min)."
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
