name: Build IPA
on:
  push:
    paths-ignore:
      - '**.md'
      - 'Tests/**'
      - '.github/workflows/uitest.yml'
      - '.github/workflows/ui-test.yml'
      - '.github/workflows/engine-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Security policy checks
        run: python3 .github/ci/security_checks.py
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          app=true
          if [ "$EVENT" = "pull_request" ]; then
            app=false
            while IFS= read -r path; do
              case "$path" in
                *.md|Tests/*) ;;
                *) app=true ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" HEAD)
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  build:
    needs: assess
    if: needs.assess.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 pinned
        with:
          path: Models/.verified-packages
          key: models-verified-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/model-lock.json', '.github/ci/heal-convert/**', '.github/ci/denoise-convert/**') }}
      - name: AI models (verified depth, scene, heal)
        run: |
          bash .github/ci/get-depth-model.sh Models
          bash .github/ci/get-seg-model.sh Models
          bash .github/ci/get-heal-model.sh Models
          bash .github/ci/denoise-convert/build-denoise.sh Models
      - name: Every AI model is really in the build
        # a failed download or conversion leaves an empty stand-in so the project still builds; a build that ships must
        # not quietly lack a model (it would export without AI Denoise, for example: quality checklist A6)
        run: |
          for m in DepthAnythingV2SmallF16 DETRResnet50SemanticSegmentationF16 LaMa Denoise; do
            [ -f "Models/$m.mlmodelc/coremldata.bin" ] || { echo "::error::Models/$m.mlmodelc is missing or empty (download or conversion failed)"; exit 1; }
          done
          echo "all four AI models present"
      - name: Install pinned XcodeGen
        run: bash .github/ci/install-xcodegen.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Lumen.xcodeproj -scheme Lumen -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          # ad-hoc signature carrying Lumen.entitlements (Increased Memory Limit), so SideStore asks for it when it
          # signs the app with Angelo's Apple ID (experiment, 22 Oct)
          codesign --force --sign - --timestamp=none --entitlements Lumen.entitlements Payload/Lumen.app
          codesign -d --entitlements - Payload/Lumen.app
          zip -qr Lumen.ipa Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: Lumen-ipa
          path: Lumen.ipa

  ready:
    name: Release readiness
    needs: [assess, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          ASSESS: ${{ needs.assess.result }}
          BUILD: ${{ needs.build.result }}
          APP: ${{ needs.assess.outputs.app }}
        run: |
          test "$ASSESS" = success
          if [ "$APP" = true ]; then test "$BUILD" = success; else test "$BUILD" = skipped; fi

  publish:
    needs: [build, ready]
    if: github.repository == 'AngeloP46/lumen' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: sidestore-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 pinned
        with:
          name: Lumen-ipa
      - name: Publish verified main build to SideStore
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then echo "Newer main commit exists; skipping stale publication."; exit 0; fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/sidestore"
          cp Lumen.ipa "Lumen-${BUILD}.ipa"
          python3 sidestore/make_source.py "Lumen-${BUILD}.ipa" "${base}/Lumen-${BUILD}.ipa" source.json
          gh release view sidestore >/dev/null 2>&1 || gh release create sidestore \
            --title "Lumen for SideStore" \
            --notes "Add this source in SideStore (Sources > +): ${base}/source.json"
          # Upload the IPA before the feed so the feed never points at a missing file.
          gh release upload sidestore "Lumen-${BUILD}.ipa" --clobber
          gh release upload sidestore source.json --clobber
          # Keep the three newest IPAs so a download already in progress still works.
          gh release view sidestore --json assets --jq '.assets[].name' \
            | grep -E '^Lumen-[0-9]+\.ipa$' | sort -t- -k2 -n -r | tail -n +4 \
            | while read -r old; do gh release delete-asset sidestore "$old" --yes; done
