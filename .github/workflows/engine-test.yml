name: Engine test
on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/Edit/**'
      - 'Tests/engine/**'
      - '.github/ci/**'
      - '.github/workflows/engine-test.yml'

# A newer push to the same branch cancels the run that is still going (saves macOS minutes).
concurrency:
  group: engine-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: write   # uploads the preview sheets to the `test-previews` release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sample photos
        run: |
          mkdir -p samples
          bash .github/ci/get.sh samples/a9.ARW "https://raw.pixls.us/data/Sony/ILCE-9/Sony_-_ILCE-9_-_compressed.ARW" 10000000
          bash .github/ci/get.sh samples/cat.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Cat_November_2010-1a.jpg?width=2000" 100000
          bash .github/ci/get.sh samples/matterhorn.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Matterhorn_from_Domh%C3%BCtte_-_2.jpg?width=2000" 100000
          bash .github/ci/get.sh samples/falls.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Hopetoun_falls.jpg?width=2000" 100000
          ls -la samples
      - uses: actions/cache@v4
        with:
          path: Models
          key: models-depth-v2s-f16-detr-seg-f16-lama-1
      - name: AI models (depth, scene, heal)
        run: |
          bash .github/ci/get-depth-model.sh Models
          bash .github/ci/get-seg-model.sh Models
          bash .github/ci/get-heal-model.sh Models
      - uses: actions/cache@v4
        with:
          path: SmartFill
          key: smartfill-cyberrealistic-v8-inpaint-6bit-1
      - name: Smart fill model
        run: bash .github/ci/get-smartfill-model.sh SmartFill
      - name: Build kernels and test tool
        run: |
          mkdir -p out
          xcrun -sdk macosx metal -fcikernel -c Sources/Edit/Kernels.metal -o out/k.air
          xcrun -sdk macosx metallib -cikernel out/k.air -o out/k.metallib
          swiftc -Onone -g -o out/engine-test \
            Sources/Edit/EditSettings.swift Sources/Edit/Curves.swift Sources/Edit/ColorCube.swift \
            Sources/Edit/Engine.swift Sources/Edit/Graph.swift Sources/Edit/Masks.swift Sources/Edit/Sky.swift Sources/Edit/Heal.swift Sources/Edit/SmartFill.swift \
            Sources/Edit/Histogram.swift \
            Tests/engine/main.swift
      - name: Run
        # The test's own exit status is the job's status. Only a crash (anything above 1) gets the lldb backtrace,
        # and the backtrace never changes the result: exit 1 = a check failed, other non-zero = it crashed.
        run: |
          set +e
          export LUMEN_DEPTH_MODEL="$PWD/Models/DepthAnythingV2SmallF16.mlmodelc"
          export LUMEN_SEG_MODEL="$PWD/Models/DETRResnet50SemanticSegmentationF16.mlmodelc"
          export LUMEN_HEAL_MODEL="$PWD/Models/LaMa.mlmodelc"
          export LUMEN_SMARTFILL_DIR="$PWD/SmartFill"
          export LUMEN_SMARTFILL_DEBUG=1
          ./out/engine-test out/k.metallib samples out/render
          code=$?
          echo "engine-test exit code: $code"
          if [ "$code" -gt 1 ]; then
            echo "::group::lldb backtrace (the test crashed)"
            lldb -b -o run -o "bt 25" -- ./out/engine-test out/k.metallib samples out/render
            echo "::endgroup::"
          fi
          exit "$code"
      - name: Publish preview sheets (test-previews release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/render/previews/*.jpg >/dev/null 2>&1 || exit 0
          gh release view test-previews >/dev/null 2>&1 || gh release create test-previews \
            --title "Engine test previews" --notes "Preview sheets from the latest engine test run (original | painted | quick heal | smart fill)." --prerelease
          gh release upload test-previews out/render/previews/*.jpg --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-renders
          path: out/render
