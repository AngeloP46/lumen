name: Engine test
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'lens-blur runs focused blur/RAW checks; empty runs the full engine'
        required: false
        default: ''
  push:
    paths:
      - 'Sources/Edit/**'
      - 'Tests/engine/**'
      - '.github/ci/**'
      - '.github/workflows/engine-test.yml'

# A newer push to the same branch cancels the run that is still going (saves macOS minutes).
concurrency:
  group: engine-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Fetch sample photos
        run: |
          mkdir -p samples
          bash .github/ci/get.sh samples/a9.ARW "https://raw.pixls.us/data/Sony/ILCE-9/Sony_-_ILCE-9_-_compressed.ARW" 10000000
          bash .github/ci/get.sh samples/cat.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Cat_November_2010-1a.jpg?width=2000" 100000
          bash .github/ci/get.sh samples/matterhorn.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Matterhorn_from_Domh%C3%BCtte_-_2.jpg?width=2000" 100000
          bash .github/ci/get.sh samples/falls.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Hopetoun_falls.jpg?width=2000" 100000
          ls -la samples
          # people on a street (Remove people); kept apart from the samples every edit case renders
          mkdir -p people
          bash .github/ci/get.sh people/bus.jpg "https://raw.githubusercontent.com/ultralytics/ultralytics/main/ultralytics/assets/bus.jpg" 50000
          # a tree against a pale sky beside a white building (sky seen through trees)
          bash .github/ci/get.sh people/building.jpg "https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/building.jpg" 50000
          # iPhone 12 Pro ProRAW (12 MP DNG, raw.pixls.us): memory and timing baseline for ProRAW (quality checklist F)
          mkdir -p proraw
          bash .github/ci/get.sh proraw/iphone12pro.DNG "https://raw.pixls.us/data/Apple/iPhone%2012%20Pro/IMG_1361.DNG" 20000000
          echo "e91e77a4533ed7cce551d83330676ea5c47dd5e55fb38adda7819366afdbdfc2  proraw/iphone12pro.DNG" | shasum -a 256 -c -
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 pinned
        with:
          path: Models/.verified-packages
          key: models-verified-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/model-lock.json', '.github/ci/heal-convert/**', '.github/ci/denoise-convert/**') }}
      - name: AI models (depth, scene, heal)
        run: |
          bash .github/ci/get-depth-model.sh Models
          bash .github/ci/get-seg-model.sh Models
          bash .github/ci/get-heal-model.sh Models
          bash .github/ci/denoise-convert/build-denoise.sh Models
      - name: Build kernels and test tool
        run: |
          mkdir -p out
          xcrun -sdk macosx metal -fcikernel -c Sources/Edit/Kernels.metal -o out/k.air
          xcrun -sdk macosx metallib -cikernel out/k.air -o out/k.metallib
          swiftc -Onone -g -o out/engine-test \
            Sources/Edit/EditSettings.swift Sources/Edit/Curves.swift Sources/Edit/ColorCube.swift Sources/Library/EditsFile.swift \
            Sources/Edit/Engine.swift Sources/Edit/LoadedModel.swift Sources/Edit/Graph.swift Sources/Edit/Masks.swift Sources/Edit/Sky.swift Sources/Edit/Heal.swift Sources/Edit/Denoise.swift \
            Sources/Edit/Histogram.swift Sources/Edit/PhotoInformation.swift Sources/Edit/Auto.swift \
            Tests/engine/main.swift
      - name: Run
        env:
          ENGINE_TEST_ONLY: ${{ github.event.inputs.only }}
        # The test's own exit status is the job's status. Only a crash (anything above 1) gets the lldb backtrace,
        # and the backtrace never changes the result: exit 1 = a check failed, other non-zero = it crashed.
        run: |
          set +e
          export LUMEN_DEPTH_MODEL="$PWD/Models/DepthAnythingV2SmallF16.mlmodelc"
          export LUMEN_SEG_MODEL="$PWD/Models/DETRResnet50SemanticSegmentationF16.mlmodelc"
          export LUMEN_HEAL_MODEL="$PWD/Models/LaMa.mlmodelc"
          export LUMEN_DENOISE_MODEL="$PWD/Models/Denoise.mlmodelc"
          export LUMEN_DENOISE_UNITS=cpu   # the CI Mac's virtual GPU runs out of memory at 24 MP; the phone uses its GPU
          export LUMEN_HEAL_EXPECT_SIDE=800
          export LUMEN_PEOPLE_SAMPLE="$PWD/people/bus.jpg"
          export LUMEN_TREES_SAMPLE="$PWD/people/building.jpg"
          EXTRA=""
          if [ "$ENGINE_TEST_ONLY" = "lens-blur" ]; then EXTRA="--lens-blur"; fi
          ./out/engine-test out/k.metallib samples out/render --ctxprobe
          exit 0
          code=$?
          echo "engine-test exit code: $code"
          if [ "$code" -gt 1 ]; then
            echo "::group::lldb backtrace (the test crashed)"
            lldb -b -o run -o "bt 25" -- ./out/engine-test out/k.metallib samples out/render
            echo "::endgroup::"
          fi
          exit "$code"
      - name: Memory budget
        # Separate process, so only the photo's own work is counted (see --memory in Tests/engine/main.swift).
        if: ${{ false }}
        run: |
          export LUMEN_HEAL_MODEL="$PWD/Models/LaMa.mlmodelc"
          export LUMEN_DENOISE_MODEL="$PWD/Models/Denoise.mlmodelc"
          export LUMEN_DENOISE_UNITS=cpu   # the CI Mac's virtual GPU runs out of memory at 24 MP; the phone uses its GPU
          export LUMEN_HEAL_EXPECT_SIDE=800
          ./out/engine-test out/k.metallib samples out/memory --memory
      - name: Memory and timing, iPhone ProRAW
        # The same steps on a 12 MP ProRAW (no AI Denoise: about 5 more minutes on the CI Mac's CPU)
        if: ${{ false }}
        run: |
          export LUMEN_HEAL_MODEL="$PWD/Models/LaMa.mlmodelc"
          export LUMEN_HEAL_EXPECT_SIDE=800
          export LUMEN_MEMORY_SKIP_DENOISE=1
          ./out/engine-test out/k.metallib proraw out/memory-proraw --memory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        if: always()
        with:
          name: engine-renders
          path: out/render
